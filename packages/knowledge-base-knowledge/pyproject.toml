[project]
name = "tools-knowledge-base-knowledge"
version = "0.1.0"
description = "The knowledge memory kind for the Knowledge Base: atomic facts about the user."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "tools-knowledge-base",
]

[project.entry-points."tools_knowledge_base.memory_kinds"]
knowledge = "tools_knowledge_base_knowledge.kind:KnowledgeKind"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base_knowledge"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
