[project]
name = "tools-knowledge-base-qdrant"
version = "0.1.0"
description = "The Qdrant vector-store adapter for the Knowledge Base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.19,<2",
    "tools-knowledge-base",
]

[project.entry-points."tools_knowledge_base.vector_stores"]
qdrant = "tools_knowledge_base_qdrant.store:QdrantStore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base_qdrant"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
