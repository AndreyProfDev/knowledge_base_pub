[project]
name = "tools-knowledge-base-workflow"
version = "0.1.0"
description = "The workflow memory kind for the Knowledge Base: named, ordered lists of steps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13",
    "tools-knowledge-base",
]

[project.entry-points."tools_knowledge_base.memory_kinds"]
workflow = "tools_knowledge_base_workflow.kind:WorkflowKind"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base_workflow"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
