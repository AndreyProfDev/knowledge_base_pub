[project]
name = "tools-knowledge-base-sqlite"
dynamic = ["version"]
description = "The SQLite vector-store adapter for the Knowledge Base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tools-knowledge-base",
]

[project.entry-points."tools_knowledge_base.vector_stores"]
sqlite = "tools_knowledge_base_sqlite.store:SqliteStore"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base_sqlite"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state the clean run left behind. The cross-process stress test is skipped:
# 12 processes per mutant times the parallel children is too much, and hits in a child
# process score nothing.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--ignore=tests/test_cross_process.py"]
process_isolation = "forkserver"
timeout_constant = 2.0
