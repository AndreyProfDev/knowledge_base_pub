# Base configuration for the knowledge base's MCP server.

# stdio = the client spawns this process and owns its lifetime (the default).
# http = a long-running server on host:port, shared by every client.
# MCP_TRANSPORT overrides, so a client config can pick without editing YAML.
transport: ${oc.env:MCP_TRANSPORT,stdio}

# Loopback only: the server is reachable from this machine, not the LAN.
host: 127.0.0.1
port: 9799

# The single endpoint every tool is served from. There are no per-tool paths.
path: /mcp

# The MCP SDK enables DNS-rebinding protection and rejects unexpected Host
# headers with 421 Misdirected Request. The defaults cover localhost on any
# port, so a client that dials a moved port still answers.
allowed_hosts:
  - localhost
  - 127.0.0.1
  - "localhost:*"
  - "127.0.0.1:*"
# Matched literally by the SDK ("*" is not a wildcard; only a ":*" port suffix
# is), so a browser request carrying any real Origin is refused with 403.
allowed_origins:
  - "*"

# TOOLS_LOG_LEVEL overrides, so verbosity can change without editing YAML.
log_level: ${oc.env:TOOLS_LOG_LEVEL,INFO}

# Log the imported modules when a stdio session ends (a test reads it; off otherwise).
debug_modules: ${oc.env:KB_DEBUG_MODULES,false}
