# Base configuration for the knowledge base's MCP server.

# http = a long-running server on host:port, shared by every client.
# stdio = the client spawns this process and owns its lifetime.
# MCP_TRANSPORT overrides, so a client config can pick without editing YAML.
transport: ${oc.env:MCP_TRANSPORT,http}

# 0.0.0.0 so Docker's published port reaches the container. compose publishes
# it on the host's loopback only, so this means "from the host", not the LAN.
# The local overlay binds 127.0.0.1 for a server run directly on the host.
host: 0.0.0.0
port: 9799

# The single endpoint every tool is served from. There are no per-tool paths.
path: /mcp

# The MCP SDK enables DNS-rebinding protection and rejects unexpected Host
# headers with 421 Misdirected Request. Behind Docker the Host is whatever the
# client dialled, so the defaults must cover localhost on any port: compose
# publishes on ${KB_MCP_PORT:-9799}, and a moved host port must still answer.
allowed_hosts:
  - localhost
  - 127.0.0.1
  - "localhost:*"
  - "127.0.0.1:*"
# Matched literally by the SDK ("*" is not a wildcard; only a ":*" port suffix
# is), so a browser request carrying any real Origin is refused with 403.
allowed_origins:
  - "*"

# TOOLS_LOG_LEVEL overrides, so a container's compose file can raise or lower
# verbosity without editing YAML.
log_level: ${oc.env:TOOLS_LOG_LEVEL,INFO}
