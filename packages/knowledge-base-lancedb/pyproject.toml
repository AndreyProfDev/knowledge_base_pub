[project]
name = "tools-knowledge-base-lancedb"
version = "0.1.0"
description = "The LanceDB vector-store adapter for the Knowledge Base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lancedb>=0.40,<0.41",
    "pyarrow>=16",
    "tools-knowledge-base",
]

[project.entry-points."tools_knowledge_base.vector_stores"]
lancedb = "tools_knowledge_base_lancedb.store:LanceStore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base_lancedb"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
