# Docker's DNS, re-asked so a recreated knowledge-api container is found at its
# new address; `resolve` also lets nginx start before the name exists.
resolver 127.0.0.11 valid=10s;

upstream knowledge_api {
    zone knowledge_api 64k;
    server knowledge-api:8000 resolve;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    # A relative Location, so `/api` -> `/api/` keeps the published port (8081, not 80).
    absolute_redirect off;

    # No framing: Delete's confirm is one click away and the app has no auth.
    # `merge` keeps these on locations that add their own Cache-Control.
    add_header_inherit merge;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;

    # The URI on proxy_pass strips the /api/ prefix. $host, not the default
    # $proxy_host, for the API's TrustedHostMiddleware.
    location /api/ {
        proxy_pass http://knowledge_api/;
        proxy_set_header Host $host;
    }

    # Vite's hashed file names.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client routes; the fallback lands in `= /index.html`.
    location / {
        try_files $uri /index.html;
    }

    # Revalidated, so a redeploy never serves an old index naming deleted chunks.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
