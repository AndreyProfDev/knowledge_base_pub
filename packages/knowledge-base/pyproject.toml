[project]
name = "tools-knowledge-base"
version = "0.1.0"
description = "A personal knowledge base: typed memory kinds, embedded and searched over a pluggable vector store."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "huey>=3.4,<4",
    "openai>=3.31,<4",
    "pydantic>=2.13",
    "pyyaml>=6",
    "stevedore>=5.9,<6",
    "tiktoken>=0.14,<1",
    "tokenizers>=0.23,<0.24",
    "knowledge-base-config",
]

[project.optional-dependencies]
# The MCP SDK and its web stack serve the MCP tools only; the CLI and the worker
# install without it.
server = ["mcp>=2,<3"]

[project.scripts]
knowledge-base-cli = "tools_knowledge_base.cli.main:main"
knowledge-base-worker = "tools_knowledge_base.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tools_knowledge_base"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state (e.g. open LanceDB tables) the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
timeout_constant = 2.0
