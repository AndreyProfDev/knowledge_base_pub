[project]
name = "knowledge-base-config"
version = "0.1.0"
description = "Structured settings: frozen pydantic classes loaded from layered YAML."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "omegaconf>=2.3",
    "pydantic>=2.13",
    "python-dotenv>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_base_config"]

# `make mutation`. forkserver: each mutant forks from a collect-only process, so it
# inherits no state (e.g. OmegaConf's resolver registry) the clean run left behind.
[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
process_isolation = "forkserver"
